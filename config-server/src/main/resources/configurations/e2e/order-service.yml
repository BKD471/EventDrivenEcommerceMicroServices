server:
  port: 8070

application:
  config:
    payment:
      url: http://localhost:8222/api/v1/payments
      connect-timeout: 2s
      read-timeout: 5s
    customer:
      url: http://localhost:8222/api/v1/customers
      connect-timeout: 2s
      read-timeout: 5s
    product:
      url: http://localhost:8222/api/v1/products
      connect-timeout: 2s
      read-timeout: 5s

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    producer:
      topicName: order-topic
      partitions: 10
      replicationFactor: 3
      minInSyncReplicas: 2
      ack: all
      retries: 5
      compressionType: gzip
      retryBackOffMs: 200
      isUncleanElection: false
      maxPollIntervalMs: 900000
      maxPollRecords: 1
      bootstrapServers: localhost:9092,localhost:9093,localhost:9094
      keySerializer: org.apache.kafka.common.serialization.StringSerializer
      valueSerializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      schemaRegistryUrl: "http://127.0.0.1:8081"
  cloud:
    openfeign:
      client:
        config:
          payment-service:
            url: ${application.config.payment.url}
          customer-service:
            url: ${application.config.customer.url}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    # Redis runs inside Docker and is accessible only via the internal Docker network.
    # Authentication is intentionally disabled and enforced via network isolation.

    # Redis is deployed as an internal-only cache within a private Docker network.
    # It is not exposed outside the cluster or VPC.
    #
    # Authentication is intentionally disabled to reduce operational overhead,
    # as access is strictly controlled via network isolation and security policies.
    #
    # If Redis is migrated to a managed or externally accessible deployment,
    # authentication (password / ACLs / TLS) MUST be enabled.
  cache:
    type: redis

app:
  cache:
    ttlMinutes: 15

aws:
  secretsmanager:
    dbSecretName: OrderServiceSecrets
    region: ap-south-1

general:
  configurations:
    maxPageSize: 50
    defaultPageSize: 5
    defaultPageNumber: 1
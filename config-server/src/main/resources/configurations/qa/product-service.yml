server:
  port: 8050

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    repair-on-migrate: true
    enabled: false
    baseline-description: "init"
    baseline-version: 0
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    # Redis runs inside Docker and is accessible only via the internal Docker network.
    # Authentication is intentionally disabled and enforced via network isolation.

    # Redis is deployed as an internal-only cache within a private Docker network.
    # It is not exposed outside the cluster or VPC.
    #
    # Authentication is intentionally disabled to reduce operational overhead,
    # as access is strictly controlled via network isolation and security policies.
    #
    # If Redis is migrated to a managed or externally accessible deployment,
    # authentication (password / ACLs / TLS) MUST be enabled.
  cache:
    type: redis

app:
  cache:
    ttlMinutes: 15

aws:
  secretsmanager:
    accessSecretName: EcommerceCredentials
    dbSecretName: ProductServiceSecrets
  s3:
    bucketName: product-profile-images-ecommerce-qa # gitguardian:ignore
    expiration: 30

general:
  configurations:
    maxPageSize: 50
    defaultPageSize: 5
    defaultPageNumber: 1
eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
spring:
  cloud:
    config:
      override-system-properties: false
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: w3c

  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      environment: prod
  health:
    redis:
      enabled: false
    reactive:
      redis:
        enabled: false
eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
spring:
  cloud:
    config:
      override-system-properties: false
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: w3c

  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      environment: dev


logging:
  pattern:
    level: "%5p [%X{traceId},%X{spanId}]"
    console: "%d{HH:mm:ss.SSS} %5p [%X{traceId},%X{spanId}] [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.data: INFO
    org.springframework.cache: INFO
    com.forsaken: INFO
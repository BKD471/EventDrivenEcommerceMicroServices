server:
  port: 8050

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    repair-on-migrate: true
    enabled: false
    baseline-description: "init"
    baseline-version: 0
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    # Redis runs inside Docker and is accessible only via the internal Docker network.
    # Authentication is intentionally disabled and enforced via network isolation.
  cache:
    type: redis

app:
  cache:
    ttlMinutes: 15

aws:
  secretsmanager:
    accessSecretName: EcommerceCredentials
    dbSecretName: ProductServiceSecrets
  s3:
    bucketName: product-profile-images-stg # gitguardian:ignore
    expiration: 30

general:
  configurations:
    maxPageSize: 50
    defaultPageSize: 5
    defaultPageNumber: 1